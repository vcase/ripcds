name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Windows x64
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ripbook
        shell: pwsh

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ripbook/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ripbook/src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Run Rust tests
        working-directory: ripbook/src-tauri
        run: cargo test

      - name: Bundle fre:ac portable
        run: pwsh -File scripts/fetch-freac.ps1

      - name: Clean stale bundle output
        run: |
          # The Rust target cache can contain installers from an earlier run.
          # Always remove them so the uploaded artifact must be produced now.
          Remove-Item -Recurse -Force "src-tauri/target/release/bundle" -ErrorAction SilentlyContinue
          Remove-Item -Force "src-tauri/target/release/ripbook.exe" -ErrorAction SilentlyContinue

      - name: Build NSIS installer
        run: npm run build:windows

      - name: Collect installer
        run: |
          $installers = @(Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" -File)
          if ($installers.Count -eq 0) { throw "No NSIS installer was produced." }

          $installer = $installers | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          $age = (Get-Date).ToUniversalTime() - $installer.LastWriteTimeUtc
          if ($age.TotalHours -gt 6) {
            throw "Refusing to upload a stale installer: $($installer.Name) was last modified $($installer.LastWriteTimeUtc.ToString('u'))."
          }

          Remove-Item -Recurse -Force "artifacts" -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path "artifacts" | Out-Null
          Copy-Item $installer.FullName "artifacts/$($installer.Name)"

          $hash = (Get-FileHash -Algorithm SHA256 $installer.FullName).Hash
          Write-Host "Installer: $($installer.FullName)"
          Write-Host "Last modified (UTC): $($installer.LastWriteTimeUtc.ToString('u'))"
          Write-Host "SHA256: $hash"
          Get-ChildItem "artifacts" | Format-Table Name, LastWriteTimeUtc, Length

          "### Installer" >> $env:GITHUB_STEP_SUMMARY
          "- Name: $($installer.Name)" >> $env:GITHUB_STEP_SUMMARY
          "- Last modified (UTC): $($installer.LastWriteTimeUtc.ToString('u'))" >> $env:GITHUB_STEP_SUMMARY
          "- SHA256: ``$hash``" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: ripbook-windows-x64-${{ github.run_number }}
          path: ripbook/artifacts/*.exe
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $installer = Get-ChildItem "ripbook/artifacts/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "No installer to publish." }
          $asset = $installer.FullName
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset --clobber
          } else {
            gh release create $tag $asset --generate-notes --title "RipBook $tag"
          }
