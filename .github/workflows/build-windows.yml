name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Windows x64
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ripbook
        shell: pwsh

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ripbook/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ripbook/src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Run Rust tests
        working-directory: ripbook/src-tauri
        run: cargo test

      - name: Bundle fre:ac portable
        run: pwsh -File scripts/fetch-freac.ps1

      - name: Build NSIS installer
        run: npm run build:windows

      - name: Collect installer
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "No NSIS installer was produced." }
          New-Item -ItemType Directory -Force -Path "artifacts" | Out-Null
          Copy-Item $installer.FullName "artifacts/$($installer.Name)"
          Get-ChildItem "artifacts" | Format-Table Name, Length

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: ripbook-windows-x64
          path: ripbook/artifacts/*.exe
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $installer = Get-ChildItem "ripbook/artifacts/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "No installer to publish." }
          $asset = $installer.FullName
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset --clobber
          } else {
            gh release create $tag $asset --generate-notes --title "RipBook $tag"
          }
